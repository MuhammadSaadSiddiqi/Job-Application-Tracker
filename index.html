<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application Archive</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0f172a; --ink-2:#334155; --mute:#64748b; --faint:#94a3b8; --ghost:#cbd5e1;
    --line:#e2e8f0; --paper:#ffffff; --ground:#f1f5f9;
    --sky:#0369a1; --amber:#b45309; --rose:#be123c;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:880px;margin:0 auto;padding:32px 16px 64px}
  @media(min-width:640px){.wrap{padding:48px 24px 80px}}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .mono{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  header.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;
    border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:28px}
  header.mast h1{margin:4px 0 0;font-size:30px;line-height:1.1;letter-spacing:-.02em;font-weight:600}
  @media(min-width:640px){header.mast h1{font-size:36px}}
  .tally{text-align:right;color:var(--mute)}
  .tally button{display:block;margin-left:auto}
  .card{background:var(--paper);border:1px solid var(--line)}
  .card-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 20px}
  .pad{padding:20px}
  button{font:inherit;cursor:pointer}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border:0;
    padding:10px 16px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .btn:hover{background:var(--ink-2)}
  .btn[disabled]{opacity:.5;cursor:default}
  .btn-quiet{background:none;border:0;color:var(--mute);padding:8px 0;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .btn-quiet:hover{color:var(--ink)}
  .btn-danger{background:var(--rose)}
  .btn-out{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--ghost);color:var(--ink-2);
    padding:7px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .btn-out:hover{border-color:var(--ink);background:var(--ink);color:#fff}
  .chip{background:var(--paper);border:1px solid var(--ghost);color:var(--mute);padding:7px 12px;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .chip:hover{border-color:var(--ink);color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip .n{color:var(--ghost);margin-left:4px}
  .chip.on .n{color:var(--faint)}
  .row{display:flex;gap:12px;flex-direction:column;margin-bottom:20px}
  @media(min-width:640px){.row{flex-direction:row;align-items:center}}
  .grow{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
  label.f{display:block}
  input[type=text],input[type=date],input[type=url],input[type=email],input[type=password],select,textarea{
    width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--ghost);
    border-radius:2px;padding:9px 12px}
  textarea{resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  ::placeholder{color:var(--ghost)}
  .grid{display:grid;gap:16px;margin-bottom:20px}
  @media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}}
  .hint{margin:6px 0 0;font-size:12px;color:var(--faint)}
  .slots{display:grid;gap:12px}
  @media(min-width:640px){.slots{grid-template-columns:1fr 1fr 1fr}}
  .slot{border:1px solid var(--line);padding:12px}
  .slot-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .slot-name{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
  .attach{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:none;
    border:1px dashed var(--ghost);color:var(--mute);padding:9px;font-size:13px}
  .attach:hover{border-color:var(--ink);color:var(--ink)}
  .fileline{display:flex;gap:8px;align-items:flex-start}
  .nm{flex:1;min-width:0}
  .nm p{margin:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .strip{display:flex;gap:4px}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    border:1px solid var(--ink);background:var(--ink);color:#fff;padding:3px 7px;border-radius:2px}
  .tag.off{background:none;border-style:dashed;border-color:var(--ghost);color:var(--ghost)}
  ul.records{list-style:none;margin:0;padding:0}
  ul.records li{margin-bottom:8px}
  .rec{width:100%;display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--paper);
    border:1px solid var(--line);padding:16px}
  .rec:hover{border-color:var(--ink)}
  @media(min-width:640px){.rec{flex-direction:row;align-items:center}}
  .rec .main{display:flex;gap:12px;flex:1;min-width:0}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px}
  .rec .title{margin:2px 0 0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rec .meta{margin:5px 0 0;color:var(--faint)}
  .rec .side{display:flex;align-items:center;gap:12px;flex:none;padding-left:20px}
  @media(min-width:640px){.rec .side{padding-left:0}}
  .stage-chip{border:1px solid;padding:4px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .empty{background:var(--paper);border:1px dashed var(--ghost);padding:56px 24px;text-align:center}
  .empty p{margin:0 auto;max-width:380px}
  .empty .sub{margin-top:6px;font-size:13px;color:var(--faint)}
  .detail-head{border-bottom:1px solid var(--line);padding:24px 20px}
  .detail-head h2{margin:8px 0 0;font-size:24px;line-height:1.15;font-weight:600}
  @media(min-width:640px){.detail-head h2{font-size:30px}}
  .sect{border-bottom:1px solid var(--line);padding:20px}
  .doc{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #f1f5f9}
  .doc:first-of-type{border-top:0}
  .doc .lbl{width:64px;flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .notes{white-space:pre-wrap;margin:0;color:var(--ink-2);font-size:14px}
  a{color:var(--sky)}
  .foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;
    border-top:1px solid var(--ghost);margin-top:32px;padding-top:16px}
  .flag{border-left:2px solid var(--ink);background:var(--paper);padding:8px 14px;margin-bottom:20px;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
  .warn{display:flex;gap:8px;border:1px solid #fecdd3;background:#fff1f2;color:#9f1239;padding:10px 12px;font-size:13px;margin-bottom:20px}
  .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal .box{background:#fff;border:1px solid var(--ghost);padding:20px;max-width:380px;width:100%}
  .gate{max-width:380px;margin:8vh auto 0}
  svg.i{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .hide{display:none}
  code{font-family:var(--mono);font-size:12px;background:var(--ground);padding:1px 4px}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ================================================================
   CONFIG — paste your two Supabase values here, then save the file
   Dashboard → Project Settings → API
   ================================================================ */
const SUPABASE_URL = "https://bhrftnirctudkiieyrzr.supabase.co";   // e.g. https://abcdefgh.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_5CTOHqnl5qJ12kqFgJRKcg_5hbScPep"; // the "anon public" key — never the service_role key
const BUCKET = "documents";
/* ================================================================ */

const I={
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  search:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  file:'<svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  down:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>',
  eye:'<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
  clip:'<svg class="i" viewBox="0 0 24 24"><path d="M21 12l-8.5 8.5a4.95 4.95 0 1 1-7-7L13 5a3.5 3.5 0 1 1 5 5l-8.5 8.5a2 2 0 1 1-3-3L15 7"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  check:'<svg class="i" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>',
  pencil:'<svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  box:'<svg class="i" viewBox="0 0 24 24"><path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="M2 3h20v5H2z"/><path d="M10 12h4"/></svg>',
  db:'<svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>',
  alert:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>',
  out:'<svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>',
};

const SLOTS=[{id:'cv',label:'CV',note:'core'},{id:'cover',label:'Cover',note:'optional'},{id:'extra',label:'Extra',note:'optional'}];
const STAGES=[
  {id:'submitted',label:'Submitted',dot:'#94a3b8',fg:'#334155',bg:'#f1f5f9',bd:'#e2e8f0'},
  {id:'screening',label:'Screening',dot:'#0284c7',fg:'#075985',bg:'#f0f9ff',bd:'#bae6fd'},
  {id:'interview',label:'Interview',dot:'#d97706',fg:'#92400e',bg:'#fffbeb',bd:'#fde68a'},
  {id:'offer',label:'Offer',dot:'#059669',fg:'#065f46',bg:'#ecfdf5',bd:'#a7f3d0'},
  {id:'closed',label:'Closed',dot:'#fb7185',fg:'#9f1239',bg:'#fff1f2',bd:'#fecdd3'},
];
const stageOf=id=>STAGES.find(s=>s.id===id)||STAGES[0];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const today=()=>new Date().toISOString().slice(0,10);
const ref=n=>'APP-'+String(n||0).padStart(3,'0');
const MAX_FILE=50*1024*1024;
function fmtDate(s){if(!s)return '—';const d=new Date(s+'T00:00:00');
  return isNaN(d)?s:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function daysSince(s){if(!s)return null;const d=new Date(s+'T00:00:00');
  return isNaN(d)?null:Math.max(0,Math.round((Date.now()-d.getTime())/86400000));}
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'
  .replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);}));

let sb=null, configOK=false;
try{
  configOK = /^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length>40;
  if(configOK) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
}catch(e){ configOK=false; }

const S={ booting:true, user:null, records:[], loading:false, view:{name:'list'}, q:'', filter:'all',
          flag:'', err:'', confirm:null, pending:{}, removed:[], formErr:'', busy:false,
          auth:{mode:'signin', busy:false, msg:'', err:''} };
const app=document.getElementById('app');
function flag(m){S.flag=m;render();clearTimeout(flag._t);flag._t=setTimeout(()=>{S.flag='';render();},3200);}

/* ---------- data ---------- */
async function loadRecords(){
  S.loading=true; render();
  const {data,error}=await sb.from('applications').select('*').order('n',{ascending:false});
  S.loading=false;
  if(error){ S.err=friendly(error); }
  else { S.err=''; S.records=(data||[]).map(fromRow); }
  render();
}
const fromRow=r=>({id:r.id,n:r.n,company:r.company,title:r.title,date:r.date_sent,stage:r.stage,
  source:r.source,link:r.link,notes:r.notes,files:r.files||[]});
const toRow=(r,uid)=>({id:r.id,user_id:uid,n:r.n,company:r.company,title:r.title,date_sent:r.date||null,
  stage:r.stage,source:r.source,link:r.link,notes:r.notes,files:r.files});
function friendly(e){
  const m=(e&&e.message?e.message:String(e));
  if(/Failed to fetch|NetworkError/i.test(m)) return 'Cannot reach the database. If the project sat unused for a week, Supabase paused it — open your Supabase dashboard and click Restore, then reload.';
  if(/relation .* does not exist/i.test(m)) return 'The applications table is missing. Run the setup SQL in the Supabase SQL editor.';
  if(/row-level security/i.test(m)) return 'Blocked by row-level security. Re-run the policy section of the setup SQL.';
  if(/Bucket not found/i.test(m)) return 'The documents storage bucket is missing. Create it in Supabase → Storage.';
  return m;
}

/* ---------- auth ---------- */
async function boot(){
  if(!configOK){ S.booting=false; render(); return; }
  const {data}=await sb.auth.getSession();
  S.user=data.session?data.session.user:null;
  S.booting=false;
  sb.auth.onAuthStateChange((_e,session)=>{
    const was=S.user?S.user.id:null;
    S.user=session?session.user:null;
    if(S.user&&S.user.id!==was){ S.view={name:'list'}; loadRecords(); }
    if(!S.user){ S.records=[]; render(); }
  });
  if(S.user) loadRecords(); else render();
}
async function doAuth(){
  const email=(document.getElementById('a-email')||{}).value||'';
  const pass=(document.getElementById('a-pass')||{}).value||'';
  if(!email.trim()||pass.length<6){ S.auth.err='Enter your email and a password of at least 6 characters.'; render(); return; }
  S.auth.busy=true; S.auth.err=''; S.auth.msg=''; render();
  const fn=S.auth.mode==='signup'?'signUp':'signInWithPassword';
  const {data,error}=await sb.auth[fn]({email:email.trim(),password:pass});
  S.auth.busy=false;
  if(error){ S.auth.err=error.message; }
  else if(S.auth.mode==='signup'&&!data.session){ S.auth.msg='Account created. Check your email to confirm it, then sign in.'; S.auth.mode='signin'; }
  render();
}
async function signOut(){ await sb.auth.signOut(); S.view={name:'list'}; S.records=[]; render(); }

/* ---------- helpers ---------- */
function saveBlob(name,blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function counts(){const c={all:S.records.length};
  STAGES.forEach(s=>c[s.id]=S.records.filter(r=>(r.stage||'submitted')===s.id).length);return c;}
function visible(){
  const t=S.q.trim().toLowerCase();
  return S.records
    .filter(r=>S.filter==='all'||(r.stage||'submitted')===S.filter)
    .filter(r=>!t||[r.company,r.title,r.source,r.notes,ref(r.n)].concat((r.files||[]).map(f=>f.name))
      .filter(Boolean).some(v=>String(v).toLowerCase().includes(t)))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||(b.n||0)-(a.n||0));
}
const strip=files=>'<div class="strip">'+SLOTS.map(s=>
  '<span class="tag'+((files||[]).some(f=>f.slot===s.id)?'':' off')+'">'+s.label+'</span>').join('')+'</div>';

/* ---------- views ---------- */
function viewSetup(){
  return `<div class="card"><div class="pad">
    <span class="eyebrow">Not configured yet</span>
    <p style="font-size:14px;color:var(--ink-2)">Open <code>index.html</code> and paste your Supabase project URL and <code>anon public</code> key into the CONFIG block at the top of the script, then save and push. Both values are in your Supabase dashboard under Project Settings → API.</p>
  </div></div>`;
}
function viewGate(){
  const a=S.auth, up=a.mode==='signup';
  return `<div class="gate card"><div class="pad">
    <span class="eyebrow">${up?'Create your account':'Sign in'}</span>
    <p style="font-size:14px;color:var(--mute);margin:6px 0 20px">
      ${up?'One account, then your archive follows you to any device.':'Same email and password on any device shows the same archive.'}</p>
    ${a.err?`<div class="warn">${I.alert}<span>${esc(a.err)}</span></div>`:''}
    ${a.msg?`<div class="flag">${esc(a.msg)}</div>`:''}
    <div class="grid">
      <label class="f"><span class="eyebrow">Email</span><input type="email" id="a-email" autocomplete="username"></label>
      <label class="f"><span class="eyebrow">Password</span><input type="password" id="a-pass" autocomplete="${up?'new-password':'current-password'}"></label>
    </div>
    <button class="btn" data-act="auth" ${a.busy?'disabled':''}>${a.busy?'Working…':(up?'Create account':'Sign in')}</button>
    <p style="margin:16px 0 0;font-size:13px;color:var(--mute)">
      ${up?'Already have an account?':'First time here?'}
      <button class="btn-quiet" data-act="auth-mode" style="letter-spacing:.06em">${up?'Sign in':'Create one'}</button></p>
  </div></div>`;
}
function viewList(){
  const c=counts(), rows=visible();
  return `
  ${S.err?`<div class="warn">${I.alert}<span>${esc(S.err)}</span></div>`:''}
  <div class="row">
    <button class="btn" data-act="new">${I.plus} Log an application</button>
    <div class="grow" style="position:relative">
      <span style="position:absolute;left:12px;top:11px;color:var(--faint)">${I.search}</span>
      <input type="text" id="q" value="${esc(S.q)}" placeholder="Search company, role, filename, notes" style="padding-left:36px">
    </div>
  </div>
  <div class="chips">${[{id:'all',label:'All'}].concat(STAGES).map(s=>
    `<button class="chip${S.filter===s.id?' on':''}" data-act="filter" data-id="${s.id}">${s.label}<span class="n">${c[s.id]||0}</span></button>`).join('')}</div>
  ${S.loading?`<div class="card"><div class="pad" style="text-align:center;padding:48px 20px">
      <span class="mono" style="color:var(--faint)">Fetching your records…</span></div></div>`
   :rows.length===0?emptyState():'<ul class="records">'+rows.map(recordRow).join('')+'</ul>'}
  ${S.records.length?`<div class="foot">
    <button class="btn-quiet" data-act="csv">${I.db} Export index (CSV)</button>
    <span class="mono" style="color:var(--faint)">Synced to your account</span></div>`:''}`;
}
function emptyState(){
  return S.records.length===0?`<div class="empty">
      <div style="color:var(--ghost);margin-bottom:10px">${I.box}</div>
      <p>The drawer is empty.</p>
      <p class="sub">Log your first application and attach the exact CV you sent. When the call comes, you'll know which version they read.</p>
      <div style="margin-top:20px"><button class="btn" data-act="new">${I.plus} Log an application</button></div>
    </div>`
  :`<div class="empty"><p style="color:var(--mute)">No records match that. Clear the search or pick another stage.</p></div>`;
}
function recordRow(r){
  const st=stageOf(r.stage), age=daysSince(r.date);
  const noCv=!(r.files||[]).some(f=>f.slot==='cv');
  return `<li><button class="rec" data-act="open" data-id="${r.id}">
    <span class="main"><span class="dot" style="background:${st.dot}"></span>
      <span style="min-width:0">
        <span style="display:flex;gap:8px;align-items:baseline">
          <span class="mono" style="color:var(--ghost)">${ref(r.n)}</span>
          <span class="mono" style="color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.company)}</span></span>
        <p class="title">${esc(r.title)}</p>
        <p class="meta mono">${fmtDate(r.date)}${age!==null?' · '+age+(age===1?' day':' days')+' ago':''}${noCv?' · <span style="color:var(--amber)">no CV attached</span>':''}</p>
      </span></span>
    <span class="side">${strip(r.files)}
      <span class="stage-chip" style="color:${st.fg};background:${st.bg};border-color:${st.bd}">${st.label}</span></span>
  </button></li>`;
}
function viewForm(){
  const ed=S.view.name==='edit'?S.view.rec:null;
  const v=(k,d)=>esc(ed?(ed[k]==null?d:ed[k]):d);
  return `<div class="card">
    <div class="card-head"><span class="eyebrow">${ed?'Edit record '+ref(ed.n):'New record'}</span>
      <button class="btn-quiet" data-act="cancel" style="color:var(--faint)" aria-label="Close">${I.x}</button></div>
    <div class="pad">
      ${S.formErr?`<div class="warn">${I.alert}<span>${esc(S.formErr)}</span></div>`:''}
      <div class="grid g2">
        <label class="f"><span class="eyebrow">Company</span><input type="text" id="f-company" value="${v('company','')}" placeholder="World Bank"></label>
        <label class="f"><span class="eyebrow">Role</span><input type="text" id="f-title" value="${v('title','')}" placeholder="Research Analyst"></label>
      </div>
      <div class="grid g3">
        <label class="f"><span class="eyebrow">Date sent</span><input type="date" id="f-date" value="${v('date',today())}"></label>
        <label class="f"><span class="eyebrow">Stage</span><select id="f-stage">${STAGES.map(s=>
          `<option value="${s.id}"${(ed&&ed.stage===s.id)?' selected':''}>${s.label}</option>`).join('')}</select></label>
        <label class="f"><span class="eyebrow">Found via</span><input type="text" id="f-source" value="${v('source','')}" placeholder="LinkedIn, referral…"></label>
      </div>
      <div class="grid"><label class="f"><span class="eyebrow">Posting link</span>
        <input type="url" id="f-link" value="${v('link','')}" placeholder="https://"></label></div>
      <span class="eyebrow" style="display:block;margin-bottom:8px">Documents submitted</span>
      <div class="slots">${SLOTS.map(s=>slotBox(s,ed)).join('')}</div>
      <p class="hint" style="margin-bottom:20px">Extra holds anything else you sent — application questions, writing sample, transcript. 50 MB per file.</p>
      <div class="grid"><label class="f"><span class="eyebrow">Prep notes</span>
        <textarea id="f-notes" rows="4" placeholder="Led CV with the Bangladesh EdTech RCT. Cover letter framed around their impact evaluation team…">${v('notes','')}</textarea>
        <p class="hint">What you tailored, who you spoke to, deadlines. This is what you'll read before the call.</p></label></div>
      <div style="display:flex;align-items:center;gap:16px;border-top:1px solid var(--line);padding-top:16px">
        <button class="btn" data-act="save" ${S.busy?'disabled':''}>${I.check} ${S.busy?'Saving…':(ed?'Save changes':'File application')}</button>
        <button class="btn-quiet" data-act="cancel" style="color:var(--faint)">Cancel</button>
      </div>
    </div></div>`;
}
function slotBox(s,ed){
  const picked=S.pending[s.id];
  const old=ed&&!S.removed.includes(s.id)?(ed.files||[]).find(f=>f.slot===s.id):null;
  const cur=picked||old;
  return `<div class="slot">
    <div class="slot-top"><span class="slot-name">${s.label}</span>
      <span class="mono" style="color:${s.note==='core'?'var(--mute)':'var(--ghost)'}">${s.note}</span></div>
    ${cur?`<div class="fileline"><span style="color:var(--mute);margin-top:2px">${I.file}</span>
        <span class="nm"><p>${esc(cur.name)}</p>
          <p class="mono" style="color:var(--faint);letter-spacing:0">${kb(cur.size)}${picked&&old?' · replaces old':''}</p></span>
        <button class="btn-quiet" data-act="clear-slot" data-id="${s.id}" style="padding:0;color:var(--ghost)">${I.x}</button></div>`
      :`<button class="attach" data-act="pick" data-id="${s.id}">${I.clip} Attach file</button>`}
    <input type="file" class="hide" id="in-${s.id}" data-slot="${s.id}"></div>`;
}
function viewDetail(r){
  const st=stageOf(r.stage), age=daysSince(r.date);
  return `<div class="card">
    <div class="card-head"><button class="btn-quiet" data-act="list">${I.back} All records</button>
      <span class="mono" style="color:var(--faint)">${ref(r.n)}</span></div>
    <div class="detail-head">
      <span class="eyebrow">${esc(r.company)}</span><h2>${esc(r.title)}</h2>
      <p class="mono" style="color:var(--mute);margin:12px 0 0">Sent ${fmtDate(r.date)}${age!==null?' · '+age+(age===1?' day':' days')+' ago':''}${r.source?' · via '+esc(r.source):''}</p>
      ${r.link?`<p style="margin:8px 0 0;font-size:13px;word-break:break-all"><a href="${esc(r.link)}" target="_blank" rel="noreferrer">${esc(r.link)}</a></p>`:''}
    </div>
    <div class="sect"><span class="eyebrow" style="display:block;margin-bottom:8px">Stage</span>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${STAGES.map(s=>
        `<button class="chip${r.stage===s.id?' on':''}" data-act="stage" data-id="${s.id}">${s.label}</button>`).join('')}</div></div>
    <div class="sect"><span class="eyebrow" style="display:block;margin-bottom:8px">What you submitted</span>
      ${SLOTS.map(s=>{const f=(r.files||[]).find(x=>x.slot===s.id);
        return `<div class="doc"><span class="lbl">${s.label}</span>
          ${f?`<span class="nm" style="flex:1"><p>${esc(f.name)}</p>
                 <p class="mono" style="color:var(--faint);letter-spacing:0">${kb(f.size)}</p></span>
               <button class="btn-out" data-act="view" data-id="${s.id}">${I.eye} View</button>
               <button class="btn-out" data-act="get" data-id="${s.id}">${I.down} Save</button>`
             :`<span style="flex:1;color:var(--ghost);font-size:13px">Nothing filed</span>`}</div>`;}).join('')}
    </div>
    <div class="sect"><span class="eyebrow" style="display:block;margin-bottom:8px">Prep notes</span>
      ${r.notes?`<p class="notes">${esc(r.notes)}</p>`
        :`<p style="color:var(--ghost);font-size:13px;margin:0">Empty. Add what you tailored while it's still fresh.</p>`}</div>
    <div class="pad" style="display:flex;gap:20px">
      <button class="btn-quiet" data-act="edit">${I.pencil} Edit</button>
      <button class="btn-quiet" data-act="ask-delete" style="color:var(--faint)">${I.trash} Delete record</button></div>
  </div>`;
}
function confirmModal(r){
  const n=(r.files||[]).length;
  return `<div class="modal"><div class="box"><span class="eyebrow">Delete ${ref(r.n)}</span>
    <p style="font-size:14px;color:var(--ink-2)">This removes the record for ${esc(r.company)} and the ${n} attached file${n===1?'':'s'} from every device. It can't be undone.</p>
    <div style="display:flex;gap:16px;align-items:center;margin-top:20px">
      <button class="btn btn-danger" data-act="do-delete">Delete</button>
      <button class="btn-quiet" data-act="cancel-delete">Keep it</button></div></div></div>`;
}

function render(){
  const c=counts();
  let body;
  if(!configOK) body=viewSetup();
  else if(S.booting) body=`<div class="card"><div class="pad" style="text-align:center;padding:56px 20px">
    <span class="mono" style="color:var(--faint)">Opening the drawer…</span></div></div>`;
  else if(!S.user) body=viewGate();
  else if(S.view.name==='new'||S.view.name==='edit') body=viewForm();
  else if(S.view.name==='detail'){ const r=S.records.find(x=>x.id===S.view.id); body=r?viewDetail(r):viewList(); }
  else body=viewList();

  app.innerHTML=`
    <header class="mast">
      <div><div style="display:flex;gap:8px;align-items:center">${I.box}
          <span class="eyebrow" style="color:var(--mute)">Application archive</span></div>
        <h1>What did I send them?</h1></div>
      ${S.user?`<div class="tally mono"><div>${c.all} ${c.all===1?'record':'records'}</div>
        <div>${c.screening+c.interview} live</div>
        <button class="btn-quiet" data-act="signout" style="color:var(--faint)">${I.out} Sign out</button></div>`:''}
    </header>
    ${S.flag?`<div class="flag">${esc(S.flag)}</div>`:''}
    ${body}
    ${S.confirm?confirmModal(S.confirm):''}`;

  const q=document.getElementById('q');
  if(q) q.addEventListener('input',e=>{S.q=e.target.value;const p=e.target.selectionStart;render();
    const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(p,p);}});
  const pw=document.getElementById('a-pass');
  if(pw) pw.addEventListener('keydown',e=>{if(e.key==='Enter') doAuth();});
}

/* ---------- actions ---------- */
function readForm(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  return {company:g('f-company').trim(),title:g('f-title').trim(),date:g('f-date'),
          stage:g('f-stage'),source:g('f-source').trim(),link:g('f-link').trim(),notes:g('f-notes')};
}
async function save(){
  const m=readForm();
  if(!m.company||!m.title){S.formErr='Company and role are both needed to file this.';render();return;}
  S.busy=true;S.formErr='';render();
  try{
    const uid=S.user.id;
    const ed=S.view.name==='edit'?S.view.rec:null;
    const id=ed?ed.id:uuid();
    let files=(ed?ed.files||[]:[]).filter(f=>!S.removed.includes(f.slot));
    for(const slot of Object.keys(S.pending)){
      const f=S.pending[slot];
      const path=`${uid}/${id}/${slot}`;
      const {error}=await sb.storage.from(BUCKET).upload(path,f,{upsert:true,contentType:f.type||'application/octet-stream'});
      if(error) throw error;
      files=files.filter(x=>x.slot!==slot);
      files.push({slot,name:f.name,size:f.size,type:f.type,path});
    }
    for(const slot of S.removed){ await sb.storage.from(BUCKET).remove([`${uid}/${id}/${slot}`]); }
    files.sort((a,b)=>SLOTS.findIndex(s=>s.id===a.slot)-SLOTS.findIndex(s=>s.id===b.slot));
    const n=ed?ed.n:(S.records.reduce((mx,r)=>Math.max(mx,r.n||0),0)+1);
    const {error}=await sb.from('applications').upsert(toRow(Object.assign({id,n},m,{files}),uid));
    if(error) throw error;
    S.pending={};S.removed=[];S.busy=false;
    await loadRecords();
    if(ed){S.view={name:'detail',id};flag('Changes saved');}
    else{S.view={name:'list'};flag('Filed as '+ref(n));}
  }catch(e){ S.busy=false;S.formErr=friendly(e);render(); }
}
async function openStored(slot,download){
  const r=S.records.find(x=>x.id===S.view.id); if(!r) return;
  const f=(r.files||[]).find(x=>x.slot===slot); if(!f) return;
  flag('Fetching '+f.name+'…');
  const opts=download?{download:f.name}:{};
  const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(f.path,120,opts);
  if(error||!data){ flag('Could not open that file'); return; }
  if(download){ const a=document.createElement('a');a.href=data.signedUrl;a.download=f.name;
    document.body.appendChild(a);a.click();a.remove(); }
  else window.open(data.signedUrl,'_blank');
}
function exportCsv(){
  const head=['ref','company','role','date_sent','stage','found_via','cv','cover','extra','link','notes'];
  const rows=[head].concat(S.records.slice().sort((a,b)=>(a.n||0)-(b.n||0)).map(r=>{
    const g=s=>{const f=(r.files||[]).find(x=>x.slot===s);return f?f.name:'';};
    return [ref(r.n),r.company,r.title,r.date,stageOf(r.stage).label,r.source||'',g('cv'),g('cover'),g('extra'),r.link||'',String(r.notes||'').replace(/\s+/g,' ')];
  }));
  saveBlob('applications-'+today()+'.csv',
    new Blob([rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act, id=t.dataset.id;
  if(act==='auth'){ await doAuth(); }
  else if(act==='auth-mode'){ S.auth.mode=S.auth.mode==='signup'?'signin':'signup';S.auth.err='';S.auth.msg='';render(); }
  else if(act==='signout'){ await signOut(); }
  else if(act==='new'){ S.pending={};S.removed=[];S.formErr='';S.view={name:'new'};render(); }
  else if(act==='filter'){ S.filter=id;render(); }
  else if(act==='open'){ S.view={name:'detail',id};render(); }
  else if(act==='list'){ S.view={name:'list'};render(); }
  else if(act==='edit'){ const r=S.records.find(x=>x.id===S.view.id);
    S.pending={};S.removed=[];S.formErr='';S.view={name:'edit',rec:r};render(); }
  else if(act==='cancel'){ const ed=S.view.name==='edit'?S.view.rec:null;
    S.pending={};S.removed=[];S.formErr='';S.view=ed?{name:'detail',id:ed.id}:{name:'list'};render(); }
  else if(act==='pick'){ const el=document.getElementById('in-'+id); if(el) el.click(); }
  else if(act==='clear-slot'){ delete S.pending[id];
    const ed=S.view.name==='edit'?S.view.rec:null;
    if(ed&&(ed.files||[]).some(f=>f.slot===id)&&!S.removed.includes(id)) S.removed.push(id);
    render(); }
  else if(act==='save'){ await save(); }
  else if(act==='stage'){ const r=S.records.find(x=>x.id===S.view.id); if(!r) return;
    const prev=r.stage; r.stage=id; render();
    const {error}=await sb.from('applications').update({stage:id}).eq('id',r.id);
    if(error){ r.stage=prev; flag('Could not update stage'); render(); } }
  else if(act==='get'){ await openStored(id,true); }
  else if(act==='view'){ await openStored(id,false); }
  else if(act==='ask-delete'){ S.confirm=S.records.find(x=>x.id===S.view.id);render(); }
  else if(act==='cancel-delete'){ S.confirm=null;render(); }
  else if(act==='do-delete'){ const r=S.confirm;
    const paths=(r.files||[]).map(f=>f.path).filter(Boolean);
    if(paths.length) await sb.storage.from(BUCKET).remove(paths);
    const {error}=await sb.from('applications').delete().eq('id',r.id);
    S.confirm=null;
    if(error){ flag('Could not delete'); }
    else { S.view={name:'list'}; await loadRecords(); flag(ref(r.n)+' deleted'); } }
  else if(act==='csv'){ exportCsv(); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.slot&&el.files[0]){
    const f=el.files[0];
    if(f.size>MAX_FILE){ S.formErr=f.name+' is '+kb(f.size)+'. Supabase caps uploads at 50 MB.'; el.value=''; render(); return; }
    S.pending[el.dataset.slot]=f; S.formErr=''; render();
  }
});
boot();
</script>
</body>
</html>
